<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SpeedTest Pro</title>
  <style>
    :root {
      --bg: #0c1220;
      --bg-card: rgba(15, 23, 42, 0.85);
      --fg: #e8edf5;
      --muted: #64748b;
      --accent: #00d4aa;
      --accent-dim: rgba(0, 212, 170, 0.15);
      --upload: #ff6b35;
      --upload-dim: rgba(255, 107, 53, 0.15);
      --border: rgba(100, 116, 139, 0.25);
      --glow-accent: rgba(0, 212, 170, 0.5);
      --glow-upload: rgba(255, 107, 53, 0.5);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .page-wrapper {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 212, 170, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 170, 0.04) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    .bg-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.2;
      pointer-events: none;
      z-index: 0;
    }

    .glow-1 {
      width: 500px;
      height: 500px;
      top: -150px;
      left: -150px;
      background: var(--accent);
    }

    .glow-2 {
      width: 400px;
      height: 400px;
      bottom: -100px;
      right: -100px;
      background: var(--upload);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      gap: 10px;
    }

    @media (min-width: 768px) {
      header {
        padding: 1.5rem 2rem;
      }
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #00d4aa, #00a080);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-icon svg {
      width: 16px;
      height: 16px;
      stroke: #0c1220;
      stroke-width: 2.5;
      fill: none;
    }

    .logo-text {
      display: none;
      font-family: "SF Mono", "Courier New", Courier, monospace;
      font-weight: 700;
      font-size: 1.125rem;
      letter-spacing: 0.05em;
    }

    @media (min-width: 640px) {
      .logo-text {
        display: block;
      }
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .traffic-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 12px;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 85px;
      justify-content: center;
    }

    .traffic-text {
      font-size: 0.7rem;
      color: var(--muted);
      display: none;
    }

    @media (min-width: 480px) {
      .traffic-text {
        display: inline;
      }
    }

    .traffic-value {
      font-family: "SF Mono", "Courier New", Courier, monospace;
      font-weight: 700;
      font-size: 0.9rem;
      text-align: right;
    }

    .traffic-unit {
      font-size: 0.7rem;
      color: var(--muted);
      margin-left: 2px;
    }

    .lang-switch {
      display: flex;
      gap: 2px;
      padding: 3px;
      background: var(--bg-card);
      border-radius: 8px;
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }

    .lang-btn {
      padding: 4px 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .lang-btn.active {
      background: var(--accent);
      color: var(--bg);
    }

    .lang-btn:hover:not(.active) {
      color: var(--fg);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.5rem 1rem;
      gap: 1rem;
    }

    @media (min-width: 768px) {
      main {
        padding: 1.5rem 2rem;
        gap: 2rem;
      }
    }

    .gauges-section {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      max-width: 900px;
    }

    @media (min-width: 480px) {
      .gauges-section {
        gap: 1.5rem;
      }
    }

    @media (min-width: 768px) {
      .gauges-section {
        gap: 3rem;
      }
    }

    @media (min-width: 1024px) {
      .gauges-section {
        gap: 5rem;
      }
    }

    .gauge-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .gauge-wrap {
      position: relative;
      width: 120px;
      height: 120px;
    }

    @media (min-width: 360px) {
      .gauge-wrap {
        width: 140px;
        height: 140px;
      }
    }

    @media (min-width: 480px) {
      .gauge-wrap {
        width: 180px;
        height: 180px;
      }
    }

    @media (min-width: 768px) {
      .gauge-wrap {
        width: 240px;
        height: 240px;
      }
    }

    .gauge-canvas {
      width: 100%;
      height: 100%;
    }

    .gauge-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 100%;
    }

    .gauge-value {
      font-family: "SF Mono", "Courier New", Courier, monospace;
      font-weight: 900;
      font-size: 1.4rem;
    }

    @media (min-width: 360px) {
      .gauge-value {
        font-size: 1.6rem;
      }
    }

    @media (min-width: 480px) {
      .gauge-value {
        font-size: 2.25rem;
      }
    }

    @media (min-width: 768px) {
      .gauge-value {
        font-size: 2.5rem;
      }
    }

    .gauge-unit-label {
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 2px;
    }

    @media (min-width: 480px) {
      .gauge-unit-label {
        font-size: 0.75rem;
      }
    }

    .gauge-label-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
    }

    @media (min-width: 480px) {
      .gauge-label-row {
        font-size: 0.875rem;
      }
    }

    .gauge-label-row svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .dl-color {
      color: var(--accent);
    }

    .ul-color {
      color: var(--upload);
    }

    .stroke-dl {
      stroke: var(--accent);
    }

    .stroke-ul {
      stroke: var(--upload);
    }

    .charts-section {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      width: 100%;
      max-width: 900px;
    }

    @media (min-width: 768px) {
      .charts-section {
        grid-template-columns: repeat(2, 1fr);
        gap: 1.25rem;
      }
    }

    .chart-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      backdrop-filter: blur(12px);
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }

    .chart-title {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .chart-avg {
      font-size: 0.75rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .chart-canvas {
      width: 100%;
      height: 100px;
    }

    @media (min-width: 768px) {
      .chart-canvas {
        height: 150px;
      }
    }

    .buttons-section {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: stretch;
      gap: 0.5rem;
      width: 100%;
      max-width: 600px;
    }

    @media (min-width: 480px) {
      .buttons-section {
        gap: 0.75rem;
      }
    }

    .action-btn {
      position: relative;
      flex: 1;
      padding: 10px 4px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-card);
      color: var(--fg);
      font-family: inherit;
      font-weight: 500;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.25s ease;
      overflow: hidden;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
    }

    @media (min-width: 360px) {
      .action-btn {
        font-size: 0.8rem;
        padding: 12px 6px;
      }
    }

    @media (min-width: 480px) {
      .action-btn {
        padding: 14px 20px;
        font-size: 0.875rem;
      }
    }

    .action-btn:hover {
      transform: translateY(-2px);
    }

    .action-btn:active {
      transform: translateY(0);
    }

    .action-btn.download:hover {
      border-color: var(--accent);
      box-shadow: 0 0 25px var(--glow-accent);
    }

    .action-btn.download.active {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .action-btn.upload:hover {
      border-color: var(--upload);
      box-shadow: 0 0 25px var(--glow-upload);
    }

    .action-btn.upload.active {
      border-color: var(--upload);
      background: var(--upload-dim);
    }

    .action-btn.dual:hover {
      border-color: var(--accent);
      box-shadow: 0 0 25px rgba(0, 212, 170, 0.3), 0 0 25px rgba(255, 107, 53, 0.3);
    }

    .action-btn.dual.active {
      background: linear-gradient(135deg, var(--accent-dim), var(--upload-dim));
      border-color: var(--accent);
    }

    .btn-icon {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    @media (min-width: 480px) {
      .btn-icon {
        width: 16px;
        height: 16px;
      }
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .status-indicator.active {
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      animation: statusPulse 1.2s ease-in-out infinite;
    }

    .status-text {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      margin-top: 0.5rem;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes statusPulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.6;
        transform: scale(1.2);
      }
    }

    .anim-in {
      animation: fadeUp 0.5s ease forwards;
      opacity: 0;
    }

    .anim-delay-1 {
      animation-delay: 0.1s;
    }

    .anim-delay-2 {
      animation-delay: 0.2s;
    }

    .anim-delay-3 {
      animation-delay: 0.3s;
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>

<body>
  <div class="bg-grid"></div>
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <div class="page-wrapper">
    <header class="anim-in">
      <div class="logo-group">
        <div class="logo-icon"><svg viewBox="0 0 24 24">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
          </svg></div>
        <span class="logo-text">SpeedTest</span>
      </div>
      <div class="header-right">
        <div class="traffic-card">
          <div class="status-indicator" id="statusDot"></div>
          <span class="traffic-text" data-i18n="traffic">流量消耗</span>
          <div class="traffic-value"><span id="totalTraffic">0.00</span><span class="traffic-unit">MB</span></div>
        </div>
        <div class="lang-switch">
          <button class="lang-btn active" data-lang="zh">中文</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>
    </header>

    <main>
      <div class="gauges-section anim-in anim-delay-1">
        <div class="gauge-unit">
          <div class="gauge-wrap">
            <canvas id="downloadGauge" class="gauge-canvas"></canvas>
            <div class="gauge-center">
              <div class="gauge-value" id="downloadValue">0</div>
              <div class="gauge-unit-label">Mbps</div>
            </div>
          </div>
          <div class="gauge-label-row dl-color">
            <svg viewBox="0 0 24 24" class="stroke-dl">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            <span data-i18n="download">下载</span>
          </div>
        </div>
        <div class="gauge-unit">
          <div class="gauge-wrap">
            <canvas id="uploadGauge" class="gauge-canvas"></canvas>
            <div class="gauge-center">
              <div class="gauge-value" id="uploadValue">0</div>
              <div class="gauge-unit-label">Mbps</div>
            </div>
          </div>
          <div class="gauge-label-row ul-color">
            <svg viewBox="0 0 24 24" class="stroke-ul">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
            <span data-i18n="upload">上传</span>
          </div>
        </div>
      </div>

      <div class="charts-section anim-in anim-delay-2">
        <div class="chart-card">
          <div class="chart-header">
            <span class="chart-title" data-i18n="downloadChart">下载速度曲线</span>
            <span class="chart-avg dl-color" id="downloadAvg">Avg: 0 Mbps</span>
          </div>
          <canvas id="downloadChart" class="chart-canvas"></canvas>
        </div>
        <div class="chart-card">
          <div class="chart-header">
            <span class="chart-title" data-i18n="uploadChart">上传速度曲线</span>
            <span class="chart-avg ul-color" id="uploadAvg">Avg: 0 Mbps</span>
          </div>
          <canvas id="uploadChart" class="chart-canvas"></canvas>
        </div>
      </div>

      <div class="buttons-section anim-in anim-delay-3">
        <button class="action-btn download" id="btnDownload">
          <svg class="btn-icon" viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          <span data-i18n="downloadBtn">下载测试</span>
        </button>
        <button class="action-btn upload" id="btnUpload">
          <svg class="btn-icon" viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          <span data-i18n="uploadBtn">上传测试</span>
        </button>
        <button class="action-btn dual" id="btnBoth">
          <svg class="btn-icon" viewBox="0 0 24 24">
            <polyline points="17 1 21 5 17 9" />
            <path d="M3 11V9a4 4 0 0 1 4-4h14" />
            <polyline points="7 23 3 19 7 15" />
            <path d="M21 13v2a4 4 0 0 1-4 4H3" />
          </svg>
          <span data-i18n="bothBtn">双向测试</span>
        </button>
      </div>
      <p class="status-text" id="statusText" data-i18n="ready">准备就绪，点击按钮开始测试</p>
    </main>
  </div>

  <script>
    console.log('%cSpeedTest FINAL (XHR only, all browsers) - ' + new Date().toLocaleTimeString(),
      'color:#00d4aa;font-weight:bold;font-size:14px');

    // ==================== 多语言 ====================
    var i18n = {
      zh: {
        traffic: '流量消耗', download: '下载', upload: '上传',
        uploadBtn: '上传测试', downloadBtn: '下载测试', bothBtn: '双向测试',
        downloadChart: '下载速度曲线', uploadChart: '上传速度曲线',
        ready: '准备就绪，点击按钮开始测试',
        uploadTesting: '正在测试上传速度...', downloadTesting: '正在测试下载速度...',
        dualTesting: '正在同时测试上传和下载...',
        uploadComplete: '上传测试完成', downloadComplete: '下载测试完成',
        allComplete: '测试全部完成',
        serverError: '服务器连接失败，请检查服务器是否正常运行',
        networkError: '网络连接异常，测试已中止'
      },
      en: {
        traffic: 'Data Usage', download: 'Download', upload: 'Upload',
        uploadBtn: 'Upload Test', downloadBtn: 'Download Test', bothBtn: 'Dual Test',
        downloadChart: 'Download Speed Curve', uploadChart: 'Upload Speed Curve',
        ready: 'Ready, click button to start',
        uploadTesting: 'Testing upload speed...', downloadTesting: 'Testing download speed...',
        dualTesting: 'Testing upload and download simultaneously...',
        uploadComplete: 'Upload test completed', downloadComplete: 'Download test completed',
        allComplete: 'All tests completed',
        serverError: 'Server connection failed, please check if server is running properly',
        networkError: 'Network connection error, test aborted'
      }
    };

    // ==================== 全局状态 ====================
    var currentLang = 'zh';
    var isRunning = false;
    var currentTest = null;
    var totalTraffic = 0;
    var maxErrors = 3;
    var downloadSpeedHistory = [];
    var uploadSpeedHistory = [];
    var downloadData = [];
    var uploadData = [];
    var maxChartPoints = 300;
    var downloadSpeed = 0;
    var uploadSpeed = 0;
    var currentAborts = [];

    // ==================== DOM ====================
    var downloadCanvas = document.getElementById('downloadGauge');
    var uploadCanvas = document.getElementById('uploadGauge');
    var downloadChartCanvas = document.getElementById('downloadChart');
    var uploadChartCanvas = document.getElementById('uploadChart');
    var downloadValue = document.getElementById('downloadValue');
    var uploadValue = document.getElementById('uploadValue');
    var downloadAvg = document.getElementById('downloadAvg');
    var uploadAvg = document.getElementById('uploadAvg');
    var totalTrafficEl = document.getElementById('totalTraffic');
    var statusText = document.getElementById('statusText');
    var statusDot = document.getElementById('statusDot');
    var btnUpload = document.getElementById('btnUpload');
    var btnDownload = document.getElementById('btnDownload');
    var btnBoth = document.getElementById('btnBoth');
    var langBtns = document.querySelectorAll('.lang-btn');

    var downloadGaugeCtx = downloadCanvas.getContext('2d');
    var uploadGaugeCtx = uploadCanvas.getContext('2d');
    var downloadChartCtx = downloadChartCanvas.getContext('2d');
    var uploadChartCtx = uploadChartCanvas.getContext('2d');

    // ==================== 服务器 & 配置 ====================
    var SPEEDTEST_SERVERS = [
      {name: '本机服务器', server: './', dlURL: 'garbage.php', ulURL: 'empty.php', pingURL: 'empty.php'}
    ];

    var TEST_CONFIG = {
      threads: 6,             // 单测并发数
      dualThreads: 3,         // 双测时每个方向的并发数（共 6，避免连接排队）
      warmup: 2000,           // 预热时长（ms，从首个字节到达开始计）
      duration: 8000,         // 测量窗口时长（ms）
      adjust: 1.00,           // 应用层真实吞吐；线路速率口径可改 1.02
      sampleInterval: 100,    // 采样间隔（ms）
      smoothWindow: 8,        // 平滑窗口（800ms，跨过上传块间隙）
      minWarmupSamples: 5,
      uploadBlockMB: 32       // 上传单块大小（MB）；越大间隙越少，需要 post_max_size ≥ 32M
    };

    // ==================== Canvas ====================
    function initCanvases() {
      var dpr = window.devicePixelRatio || 1;
      [downloadCanvas, uploadCanvas, downloadChartCanvas, uploadChartCanvas].forEach(function (canvas) {
        var rect = canvas.getBoundingClientRect();
        canvas.width = Math.max(1, rect.width * dpr);
        canvas.height = Math.max(1, rect.height * dpr);
      });
      [downloadGaugeCtx, uploadGaugeCtx, downloadChartCtx, uploadChartCtx].forEach(function (ctx) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
      });
    }

    function drawGauge(ctx, canvas, value, maxValue, color, glowColor) {
      var rect = canvas.getBoundingClientRect();
      var w = rect.width, h = rect.height;
      var cx = w / 2, cy = h / 2;
      var radius = Math.max(10, Math.min(cx, cy) - 15);
      var lineWidth = Math.max(4, radius * 0.12);
      ctx.clearRect(0, 0, w, h);
      ctx.beginPath();
      ctx.arc(cx, cy, radius, Math.PI * 0.75, Math.PI * 2.25, false);
      ctx.strokeStyle = 'rgba(100, 116, 139, 0.15)';
      ctx.lineWidth = lineWidth; ctx.lineCap = 'round'; ctx.stroke();

      var progress = Math.min(1, Math.max(0, value / maxValue));
      if (progress > 0.001) {
        var endAngle = Math.PI * 0.75 + progress * Math.PI * 1.5;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, Math.PI * 0.75, endAngle, false);
        ctx.strokeStyle = glowColor; ctx.lineWidth = lineWidth + 6;
        ctx.lineCap = 'round'; ctx.stroke();
        ctx.beginPath();
        ctx.arc(cx, cy, radius, Math.PI * 0.75, endAngle, false);
        ctx.strokeStyle = color; ctx.lineWidth = lineWidth;
        ctx.lineCap = 'round'; ctx.stroke();
      }
      for (var i = 0; i <= 10; i++) {
        var angle = Math.PI * 0.75 + (i / 10) * Math.PI * 1.5;
        var inner = radius - lineWidth / 2 - 6;
        var outer = radius - lineWidth / 2 - (i % 2 === 0 ? 14 : 10);
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(angle) * inner, cy + Math.sin(angle) * inner);
        ctx.lineTo(cx + Math.cos(angle) * outer, cy + Math.sin(angle) * outer);
        ctx.strokeStyle = i % 2 === 0 ? 'rgba(232, 237, 245, 0.25)' : 'rgba(232, 237, 245, 0.1)';
        ctx.lineWidth = i % 2 === 0 ? 1.5 : 1;
        ctx.stroke();
      }
    }

    function drawChart(ctx, canvas, data, color, glowColor) {
      var rect = canvas.getBoundingClientRect();
      var w = rect.width, h = rect.height;
      var padding = {top: 10, right: 10, bottom: 20, left: 10};
      var chartW = w - padding.left - padding.right;
      var chartH = h - padding.top - padding.bottom;
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = 'rgba(100, 116, 139, 0.1)';
      ctx.lineWidth = 1;
      for (var gi = 0; gi <= 4; gi++) {
        var gy = padding.top + (chartH / 4) * gi;
        ctx.beginPath(); ctx.moveTo(padding.left, gy);
        ctx.lineTo(w - padding.right, gy); ctx.stroke();
      }
      if (data.length < 2) return;
      var maxVal = Math.max.apply(null, data.concat([100]));
      var displayData = data.length > maxChartPoints ? data.slice(-maxChartPoints) : data;
      var xStep = chartW / (displayData.length - 1);
      var points = displayData.map(function (v, i) {
        return {
          x: padding.left + i * xStep,
          y: padding.top + chartH - (v / maxVal) * chartH
        };
      });
      var gradient = ctx.createLinearGradient(0, padding.top, 0, h - padding.bottom);
      gradient.addColorStop(0, glowColor);
      gradient.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath();
      ctx.moveTo(points[0].x, h - padding.bottom);
      points.forEach(function (p) {ctx.lineTo(p.x, p.y);});
      ctx.lineTo(points[points.length - 1].x, h - padding.bottom);
      ctx.closePath(); ctx.fillStyle = gradient; ctx.fill();

      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (var pi = 1; pi < points.length; pi++) ctx.lineTo(points[pi].x, points[pi].y);
      ctx.strokeStyle = color; ctx.lineWidth = 2;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();

      var last = points[points.length - 1];
      ctx.beginPath(); ctx.arc(last.x, last.y, 4, 0, Math.PI * 2);
      ctx.fillStyle = color; ctx.fill();
      ctx.beginPath(); ctx.arc(last.x, last.y, 8, 0, Math.PI * 2);
      ctx.fillStyle = glowColor; ctx.fill();
    }

    function updateDisplay() {
      downloadValue.textContent = Math.round(downloadSpeed);
      uploadValue.textContent = Math.round(uploadSpeed);
      totalTrafficEl.textContent = totalTraffic.toFixed(2);

      drawGauge(downloadGaugeCtx, downloadCanvas, downloadSpeed, 1000, '#00d4aa', 'rgba(0, 212, 170, 0.3)');
      drawGauge(uploadGaugeCtx, uploadCanvas, uploadSpeed, 500, '#ff6b35', 'rgba(255, 107, 53, 0.3)');
      drawChart(downloadChartCtx, downloadChartCanvas, downloadData, '#00d4aa', 'rgba(0, 212, 170, 0.2)');
      drawChart(uploadChartCtx, uploadChartCanvas, uploadData, '#ff6b35', 'rgba(255, 107, 53, 0.2)');

      if (downloadData.length > 0) {
        var dValid = downloadData.length > 10 ? downloadData.slice(Math.floor(downloadData.length * 0.2)) : downloadData;
        var avgDown = dValid.reduce(function (a, b) {return a + b;}, 0) / dValid.length;
        downloadAvg.textContent = 'Avg: ' + Math.round(avgDown) + ' Mbps';
      } else {
        downloadAvg.textContent = 'Avg: 0 Mbps';
      }
      if (uploadData.length > 0) {
        var uValid = uploadData.length > 10 ? uploadData.slice(Math.floor(uploadData.length * 0.2)) : uploadData;
        var avgUp = uValid.reduce(function (a, b) {return a + b;}, 0) / uValid.length;
        uploadAvg.textContent = 'Avg: ' + Math.round(avgUp) + ' Mbps';
      } else {
        uploadAvg.textContent = 'Avg: 0 Mbps';
      }
    }

    // ==================== 数据工具 ====================
    function resetTestData() {
      downloadSpeed = 0; uploadSpeed = 0;
      downloadSpeedHistory = []; uploadSpeedHistory = [];
      downloadData = []; uploadData = [];
      updateDisplay();
    }

    function smoothSpeed(type, newSpeed) {
      var history = type === 'download' ? downloadSpeedHistory : uploadSpeedHistory;
      history.push(newSpeed);
      if (history.length > TEST_CONFIG.smoothWindow) history.shift();
      var sum = 0;
      for (var i = 0; i < history.length; i++) sum += history[i];
      var smoothed = sum / history.length;
      if (type === 'download') downloadSpeed = smoothed;
      else uploadSpeed = smoothed;
      return smoothed;
    }

    function addChartData(type, value) {
      if (type === 'download') {
        downloadData.push(value);
        if (downloadData.length > maxChartPoints) downloadData.shift();
      } else {
        uploadData.push(value);
        if (uploadData.length > maxChartPoints) uploadData.shift();
      }
    }

    // 双侧 15% 修剪 + 中位数（对非对称分布鲁棒）
    function calculateStableSpeed(arr) {
      if (!arr.length) return 0;
      if (arr.length < 5) {
        var s = 0;
        for (var i = 0; i < arr.length; i++) s += arr[i];
        return s / arr.length;
      }
      var sorted = arr.slice().sort(function (a, b) {return a - b;});
      var trim = Math.floor(sorted.length * 0.15);
      var core = sorted.slice(trim, sorted.length - trim);
      if (!core.length) return sorted[Math.floor(sorted.length / 2)];
      var mid = Math.floor(core.length / 2);
      return core.length % 2 ? core[mid] : (core[mid - 1] + core[mid]) / 2;
    }

    // ==================== 上传数据块（懒生成，全局共享） ====================
    var _uploadBlobCache = null;
    function getUploadBlob() {
      if (_uploadBlobCache) return _uploadBlobCache;
      var blockBytes = TEST_CONFIG.uploadBlockMB * 1024 * 1024;
      // crypto.getRandomValues 单次上限 65536 字节；用 64KB 种子拼成 32MB
      // 拼装用的是 Blob 数组，浏览器只保存引用，不会真占 32MB × N
      var seed = new Uint8Array(65536);
      if (window.crypto && crypto.getRandomValues) {
        crypto.getRandomValues(seed);
      } else {
        for (var si = 0; si < seed.length; si++) seed[si] = (Math.random() * 256) | 0;
      }
      var count = blockBytes / 65536;
      var parts = [];
      for (var pi = 0; pi < count; pi++) parts.push(seed);
      _uploadBlobCache = new Blob(parts, {type: 'application/octet-stream'});
      return _uploadBlobCache;
    }

    // ==================== 通用错误处理 ====================
    function handleRequestError(xhrRef, errIdx, localTesters, localTimeouts, createFn, state) {
      if (state.isAborted) return;
      state.localErrorCount++;
      if (state.localErrorCount >= maxErrors) {
        if (!state.isAborted) {
          statusText.textContent = i18n[currentLang].serverError;
          stopTest();
        }
        return;
      }
      var tid = setTimeout(function () {
        if (state.isAborted) return;
        var i = localTesters.indexOf(xhrRef);
        if (i !== -1) localTesters[i] = createFn(errIdx);
      }, 500);
      localTimeouts.push(tid);
    }

    // ==================== 下载测试 ====================
    function runDownloadTest(server, threads, onProgress, onComplete) {
      var url = server.server + server.dlURL;
      var totalLoaded = 0;
      var prevLoaded = 0;
      var prevTime = null;
      var measureStart = null;
      var samples = [];
      var dynamicChunkSize = 16;

      var localTesters = [];
      var localTimers = [];
      var localTimeouts = [];
      var state = {isAborted: false, localErrorCount: 0};

      function forceAbortLocal() {
        state.isAborted = true;
        localTimers.forEach(function (t) {clearTimeout(t);});
        localTimers = [];
        localTimeouts.forEach(function (t) {clearTimeout(t);});
        localTimeouts = [];
        localTesters.forEach(function (t) {
          if (t) {
            t.onload = t.onerror = t.onprogress = null;
            if (t.upload) t.upload.onprogress = null;
            if (t.readyState !== 4) t.abort();
          }
        });
        localTesters = [];
      }
      currentAborts.push(forceAbortLocal);

      function createDlThread(idx) {
        if (state.isAborted) return null;
        var xhr = new XMLHttpRequest();
        var lastLoaded = 0;
        localTesters.push(xhr);

        xhr.onprogress = function (e) {
          var newLoaded = e.loaded - lastLoaded;
          if (newLoaded <= 0) return;
          totalLoaded += newLoaded;
          totalTraffic += newLoaded / 1048576;
          lastLoaded = e.loaded;
          if (measureStart === null) {
            measureStart = performance.now();
            prevTime = measureStart;
            prevLoaded = totalLoaded;
          }
        };
        xhr.onload = function () {
          if (state.isAborted) return;
          if (xhr.status === 200) {
            lastLoaded = 0;
            xhr.open('GET', url + '?cors=true&ckSize=' + dynamicChunkSize + '&n=' + Math.random(), true);
            xhr.responseType = 'arraybuffer';
            xhr.send();
          } else {
            handleRequestError(xhr, idx, localTesters, localTimeouts, createDlThread, state);
          }
        };
        xhr.onerror = function () {
          handleRequestError(xhr, idx, localTesters, localTimeouts, createDlThread, state);
        };

        xhr.open('GET', url + '?cors=true&ckSize=' + dynamicChunkSize + '&n=' + Math.random(), true);
        xhr.responseType = 'arraybuffer';
        xhr.send();
        return xhr;
      }

      for (var di = 0; di < threads; di++) createDlThread(di);

      var nextTick = performance.now() + TEST_CONFIG.sampleInterval;

      function sample() {
        if (state.isAborted) return;
        var now = performance.now();

        if (measureStart === null) {
          nextTick = now + TEST_CONFIG.sampleInterval;
          localTimers.push(setTimeout(sample, TEST_CONFIG.sampleInterval));
          return;
        }

        var elapsed = now - measureStart;
        var timeDiff = now - prevTime;
        var bytesDiff = totalLoaded - prevLoaded;

        if (timeDiff > 0 && bytesDiff >= 0) {
          var instantSpeed = (bytesDiff / timeDiff) / 125 * TEST_CONFIG.adjust;
          var smoothedSpeed = smoothSpeed('download', instantSpeed);

          if (elapsed >= TEST_CONFIG.warmup) {
            samples.push(instantSpeed);
            if (instantSpeed > 800) dynamicChunkSize = 32;
            else if (instantSpeed > 400) dynamicChunkSize = 24;
            else if (instantSpeed > 150) dynamicChunkSize = 16;
            else if (instantSpeed > 50) dynamicChunkSize = 8;
            else dynamicChunkSize = 4;
          }

          onProgress(smoothedSpeed);
          addChartData('download', smoothedSpeed);
        }

        prevLoaded = totalLoaded;
        prevTime = now;

        if (elapsed >= TEST_CONFIG.warmup + TEST_CONFIG.duration &&
          samples.length >= TEST_CONFIG.minWarmupSamples) {
          forceAbortLocal();
          onComplete(calculateStableSpeed(samples));
          return;
        }

        nextTick += TEST_CONFIG.sampleInterval;
        localTimers.push(setTimeout(sample, Math.max(0, nextTick - performance.now())));
      }
      localTimers.push(setTimeout(sample, TEST_CONFIG.sampleInterval));
    }

    // ==================== 上传测试（纯 XHR + 大块） ====================
    function runUploadTest(server, threads, onProgress, onComplete) {
      var url = server.server + server.ulURL;
      var blob = getUploadBlob();

      var totalUploaded = 0;
      var prevUploaded = 0;
      var prevTime = null;
      var measureStart = null;
      var samples = [];

      var localTesters = [];
      var localTimers = [];
      var localTimeouts = [];
      var state = {isAborted: false, localErrorCount: 0};

      function forceAbortLocal() {
        state.isAborted = true;
        localTimers.forEach(function (t) {clearTimeout(t);});
        localTimers = [];
        localTimeouts.forEach(function (t) {clearTimeout(t);});
        localTimeouts = [];
        localTesters.forEach(function (t) {
          if (t) {
            t.onload = t.onerror = t.onprogress = null;
            if (t.upload) t.upload.onprogress = null;
            if (t.readyState !== 4) t.abort();
          }
        });
        localTesters = [];
      }
      currentAborts.push(forceAbortLocal);

      function createUlThread() {
        if (state.isAborted) return null;
        var xhr = new XMLHttpRequest();
        var lastUploaded = 0;
        localTesters.push(xhr);

        xhr.upload.onprogress = function (e) {
          var newUploaded = e.loaded - lastUploaded;
          if (newUploaded <= 0) return;
          totalUploaded += newUploaded;
          totalTraffic += newUploaded / 1048576;
          lastUploaded = e.loaded;
          if (measureStart === null) {
            measureStart = performance.now();
            prevTime = measureStart;
            prevUploaded = totalUploaded;
          }
        };
        xhr.onload = function () {
          if (state.isAborted) return;
          if (xhr.status === 200) {
            lastUploaded = 0;
            xhr.open('POST', url + '?cors=true&n=' + Math.random(), true);
            xhr.setRequestHeader('Content-Type', 'application/octet-stream');
            xhr.send(blob);
          } else {
            handleRequestError(xhr, null, localTesters, localTimeouts, createUlThread, state);
          }
        };
        xhr.onerror = function () {
          handleRequestError(xhr, null, localTesters, localTimeouts, createUlThread, state);
        };

        xhr.open('POST', url + '?cors=true&n=' + Math.random(), true);
        xhr.setRequestHeader('Content-Type', 'application/octet-stream');
        xhr.send(blob);
        return xhr;
      }

      // 抖动启动：每线程错开 60ms，避免所有线程同时进入块间隙
      for (var ui = 0; ui < threads; ui++) {
        (function (i) {
          setTimeout(function () {if (!state.isAborted) createUlThread();}, i * 60);
        })(ui);
      }

      var nextTick = performance.now() + TEST_CONFIG.sampleInterval;
      function sample() {
        if (state.isAborted) return;
        var now = performance.now();
        if (measureStart === null) {
          nextTick = now + TEST_CONFIG.sampleInterval;
          localTimers.push(setTimeout(sample, TEST_CONFIG.sampleInterval));
          return;
        }
        var elapsed = now - measureStart;
        var timeDiff = now - prevTime;
        var bytesDiff = totalUploaded - prevUploaded;
        if (timeDiff > 0 && bytesDiff >= 0) {
          var instantSpeed = (bytesDiff / timeDiff) / 125 * TEST_CONFIG.adjust;
          var smoothedSpeed = smoothSpeed('upload', instantSpeed);
          if (elapsed >= TEST_CONFIG.warmup) samples.push(instantSpeed);
          onProgress(smoothedSpeed);
          addChartData('upload', smoothedSpeed);
        }
        prevUploaded = totalUploaded;
        prevTime = now;
        if (elapsed >= TEST_CONFIG.warmup + TEST_CONFIG.duration &&
          samples.length >= TEST_CONFIG.minWarmupSamples) {
          forceAbortLocal();
          onComplete(calculateStableSpeed(samples));
          return;
        }
        nextTick += TEST_CONFIG.sampleInterval;
        localTimers.push(setTimeout(sample, Math.max(0, nextTick - performance.now())));
      }
      localTimers.push(setTimeout(sample, TEST_CONFIG.sampleInterval));
    }

    // ==================== 测试编排 ====================
    function runSingleTest(type, callback) {
      var server = SPEEDTEST_SERVERS[0];
      if (!server) {alert('未配置测速服务器'); return;}
      var t = TEST_CONFIG.threads;
      if (type === 'download') {
        runDownloadTest(server, t,
          function (speed) {downloadSpeed = speed; updateDisplay();},
          function (finalSpeed) {downloadSpeed = finalSpeed; updateDisplay(); callback();});
      } else if (type === 'upload') {
        runUploadTest(server, t,
          function (speed) {uploadSpeed = speed; updateDisplay();},
          function (finalSpeed) {uploadSpeed = finalSpeed; updateDisplay(); callback();});
      }
    }

    function runDualTest(callback) {
      var server = SPEEDTEST_SERVERS[0];
      if (!server) return;
      var t = TEST_CONFIG.dualThreads;
      var dlDone = false, ulDone = false;
      runDownloadTest(server, t,
        function (speed) {downloadSpeed = speed; updateDisplay();},
        function (finalSpeed) {
          downloadSpeed = finalSpeed; updateDisplay();
          dlDone = true;
          if (dlDone && ulDone) callback();
        });
      runUploadTest(server, t,
        function (speed) {uploadSpeed = speed; updateDisplay();},
        function (finalSpeed) {
          uploadSpeed = finalSpeed; updateDisplay();
          ulDone = true;
          if (dlDone && ulDone) callback();
        });
    }

    function startTest(type) {
      if (isRunning) return;
      isRunning = true;
      currentTest = type;
      currentAborts = [];
      resetTestData();

      statusDot.classList.add('active');
      [btnUpload, btnDownload, btnBoth].forEach(function (btn) {btn.classList.remove('active');});

      var tests = {
        download: function () {
          btnDownload.classList.add('active');
          statusText.textContent = i18n[currentLang].downloadTesting + ' (预热中...)';
          setTimeout(function () {
            if (isRunning) statusText.textContent = i18n[currentLang].downloadTesting;
          }, TEST_CONFIG.warmup);
          runSingleTest('download', function () {
            statusText.textContent = i18n[currentLang].downloadComplete;
            stopTest();
          });
        },
        upload: function () {
          btnUpload.classList.add('active');
          statusText.textContent = i18n[currentLang].uploadTesting + ' (预热中...)';
          setTimeout(function () {
            if (isRunning) statusText.textContent = i18n[currentLang].uploadTesting;
          }, TEST_CONFIG.warmup);
          runSingleTest('upload', function () {
            statusText.textContent = i18n[currentLang].uploadComplete;
            stopTest();
          });
        },
        both: function () {
          btnBoth.classList.add('active');
          statusText.textContent = i18n[currentLang].dualTesting + ' (预热中...)';
          setTimeout(function () {
            if (isRunning) statusText.textContent = i18n[currentLang].dualTesting;
          }, TEST_CONFIG.warmup);
          runDualTest(function () {
            statusText.textContent = i18n[currentLang].allComplete;
            stopTest();
          });
        }
      };
      tests[type]();
    }

    function stopTest() {
      isRunning = false;
      currentTest = null;
      currentAborts.forEach(function (fn) {fn();});
      currentAborts = [];
      statusDot.classList.remove('active');
      [btnUpload, btnDownload, btnBoth].forEach(function (btn) {btn.classList.remove('active');});
    }

    function switchLang(lang) {
      currentLang = lang;
      langBtns.forEach(function (btn) {btn.classList.toggle('active', btn.dataset.lang === lang);});
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var key = el.dataset.i18n;
        if (i18n[lang][key]) el.textContent = i18n[lang][key];
      });
      if (!isRunning) statusText.textContent = i18n[lang].ready;
    }

    // ==================== 事件绑定 ====================
    btnDownload.addEventListener('click', function () {startTest('download');});
    btnUpload.addEventListener('click', function () {startTest('upload');});
    btnBoth.addEventListener('click', function () {startTest('both');});
    langBtns.forEach(function (btn) {btn.addEventListener('click', function () {switchLang(btn.dataset.lang);});});

    var resizeTimer;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {initCanvases(); updateDisplay();}, 200);
    });

    initCanvases();
    updateDisplay();
  </script>
</body>
